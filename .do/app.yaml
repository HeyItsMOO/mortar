# App Platform spec for the share page at mortar.rethunk.tech. Static site: App Platform
# offers no response-header setting for static sites, so the page carries its own
# robots and referrer meta tags and the fleet header set (no HSTS, no CSP) is not applied.
name: mortar-site
region: sfo
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: mortar.rethunk.tech
    type: PRIMARY
    zone: rethunk.tech
static_sites:
  # Both components deploy from the orphan `packages` branch, which package-repo.yml replaces with the tagged site
  # and the signed apt, dnf and pacman repository on each release, so an ordinary push to main never changes the site.
  - name: site
    github:
      repo: Rethunk-Tech/mortar
      branch: packages
      deploy_on_push: true
    environment_slug: html
    source_dir: site
    routes:
      - path: /
  - name: packages
    github:
      repo: Rethunk-Tech/mortar
      branch: packages
      deploy_on_push: true
    environment_slug: html
    source_dir: packages
    routes:
      - path: /packages
